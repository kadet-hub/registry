# SEC-18, RISK-14: advisories with a fix that the pinned binaries cannot take
# yet. Each entry names one binary. The statement says what the binary's
# .gopclntab holds of the advisory's packages, checked on 2026-11-06.
vulnerabilities:
  - id: CVE-2026-56857
    paths: [usr/local/bin/conftest]
    expired_at: 2027-02-06
    statement: conftest v0.71.1, the newest release, is built with Go 1.27.1. GO-2026-6604 is Windows code only. The Linux binary's .gopclntab holds no Windows source file of os and nothing of internal/syscall/windows.
  - id: CVE-2026-56866
    paths: [usr/local/bin/conftest]
    expired_at: 2027-02-06
    statement: conftest v0.71.1, the newest release, is built with Go 1.27.1. Its .gopclntab holds net/http.(*persistConn).readLoop, the HTTP/1 client code of GO-2026-6605. conftest test runs on the compiled files in a container without network, so the client has no server to talk to.
  - id: CVE-2026-78659
    paths: [usr/local/bin/conftest]
    expired_at: 2027-02-06
    statement: conftest v0.71.1, the newest release, is built with Go 1.27.1 and links golang.org/x/net v0.58.0. Its .gopclntab holds (*Framer).readMetaFrame of net/http/internal/http2 and golang.org/x/net/http2, the HTTP/2 server code of GO-2026-6603. conftest test runs on the compiled files in a container without network and serves no HTTP.
