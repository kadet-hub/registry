name: setup-gate
description: Install gVisor with the tracing runtime, the scanners, the sandbox image and check (SEC-1 to SEC-11, REC-5).
runs:
  using: composite
  steps:
    - name: Install scanners
      shell: bash
      env:
        # renovate: datasource=github-release-attachments depName=gitleaks/gitleaks
        GITLEAKS_VERSION: v8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
        sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
        python3 -m venv scan/.venv
        scan/.venv/bin/pip install --quiet --require-hashes --no-deps -r scan/requirements.txt

    - name: Fetch check
      shell: bash
      env:
        # renovate: datasource=github-tags depName=kadet-hub/recipes versioning=regex:^check-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
        CHECK_VERSION: check-v0.9.0
        CHECK_SHA: 89b14c087fafa3ca3de39c61680ef7d84da3d423
      run: |
        git init -q --bare "$RUNNER_TEMP/check.git"
        git --git-dir="$RUNNER_TEMP/check.git" fetch -q --depth=1 --no-tags https://github.com/kadet-hub/recipes.git "$CHECK_SHA"
        python3 gate/fetch_tree.py --git-dir "$RUNNER_TEMP/check.git" --rev "$CHECK_SHA" --path check --out gate/.check

    - uses: ./.github/actions/setup-gvisor # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

    - name: Build sandbox image
      shell: bash
      run: docker build -t kadet-hub/sandbox sandbox
