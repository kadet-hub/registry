name: setup-gate
description: Install gVisor with the tracing runtime, the scanners and the sandbox image (SEC-1 to SEC-11).
runs:
  using: composite
  steps:
    - name: Install scanners
      shell: bash
      env:
        # renovate: datasource=github-releases depName=gitleaks/gitleaks
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
        sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
        python3 -m venv scan/.venv
        scan/.venv/bin/pip install --quiet --require-hashes --no-deps -r scan/requirements.txt

    - uses: ./.github/actions/setup-gvisor # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

    - name: Build sandbox image
      shell: bash
      run: docker build -t kadet-hub/sandbox sandbox
