name: setup-oras
description: Install oras pinned by sha256 and log in to ghcr.io (PUB-2, GI-6).
inputs:
  token:
    description: Token with packages write; without one oras pulls public packages anonymously
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install oras
      shell: bash
      env:
        # renovate: datasource=github-release-attachments depName=oras-project/oras
        ORAS_VERSION: v1.3.4
        ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
      run: |
        curl -fsSLo "$RUNNER_TEMP/oras.tar.gz" "https://github.com/oras-project/oras/releases/download/${ORAS_VERSION}/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
        echo "${ORAS_SHA256}  $RUNNER_TEMP/oras.tar.gz" | sha256sum -c -
        sudo tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C /usr/local/bin oras

    - name: Log in to ghcr.io
      if: inputs.token != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: printf '%s' "$TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
