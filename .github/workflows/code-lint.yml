name: code-lint

# CI-3: ruff and shellcheck on every pull request; the scripts share no directory a paths filter could name.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ruff and shellcheck
        env:
          # renovate: datasource=github-release-attachments depName=astral-sh/ruff
          RUFF_VERSION: 0.17.3
          RUFF_SHA256: 2b0890f5a55900af741f133918c2656919bbf18c2ab7741b4ca8403a90e647a9
          # renovate: datasource=github-release-attachments depName=koalaman/shellcheck
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          curl -fsSLo "$RUNNER_TEMP/ruff.tar.gz" "https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz"
          echo "${RUFF_SHA256}  $RUNNER_TEMP/ruff.tar.gz" | sha256sum -c -
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.gz" "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/ruff.tar.gz" -C /usr/local/bin --strip-components=1 ruff-x86_64-unknown-linux-gnu/ruff
          sudo tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C /usr/local/bin --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"

      - name: ruff
        run: ruff check --no-cache --output-format github

      - name: shellcheck
        # Tracked files named *.sh or with an sh, bash or dash shebang.
        run: |
          git ls-files -z | xargs -0 awk 'FNR == 1 && (FILENAME ~ /\.sh$/ || /^#!.*[\/ ](ba|da)?sh([[:space:]]|$)/) { print FILENAME } { nextfile }' >"$RUNNER_TEMP/scripts"
          xargs -a "$RUNNER_TEMP/scripts" -d '\n' shellcheck --format gcc
