name: gate

# pull_request_target takes this file from main, never from the pull request
# (GI-1). Nothing below checks out or runs pull request content.
on: # zizmor: ignore[dangerous-triggers] the gate reads the entry through the API only (GI-1)
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      attestations: read # gh attestation verify of the index and a recipe's generators (REC-6)
    outputs:
      proof: ${{ steps.proof.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gate # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - uses: ./.github/actions/setup-oras # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - name: Gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export GATE_OUT=$RUNNER_TEMP/report PROOF_OUT=$RUNNER_TEMP/proof.tar
          mkdir -p "$GATE_OUT"
          set -o pipefail
          gate/run 2>&1 | tee "$GATE_OUT/report.txt"

      - name: Keep the report for the comment job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-report
          path: ${{ runner.temp }}/report
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the recipe's compile for the renders job (REC-9)
        id: proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-proof
          path: ${{ runner.temp }}/proof.tar
          retention-days: 1
          if-no-files-found: ignore

  # REC-9: check's renders proof on kind, over what the gate job fetched and
  # compiled; nothing from the pull request is fetched or compiled here.
  renders:
    name: renders
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.proof != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recipe-proof
          path: ${{ runner.temp }}

      - uses: ./.github/actions/setup-check # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - uses: ./.github/actions/setup-kind # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - name: Renders
        run: |
          proof=$RUNNER_TEMP/proof
          mkdir -p "$RUNNER_TEMP/report" "$proof"
          tar -xf "$RUNNER_TEMP/proof.tar" -C "$proof"
          set -o pipefail
          { echo "## Renders"; gate/recipe-renders "$proof/recipes" "$(cat -- "$proof/name")" "$proof/proof"; } 2>&1 \
            | tee "$RUNNER_TEMP/report/report.txt"

      - name: Keep the report for the comment job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renders-report
          path: ${{ runner.temp }}/report
          retention-days: 7
          if-no-files-found: ignore

  # GI-4: posts the reports as escaped text; no checkout, no other permission.
  comment:
    needs: [gate, renders]
    if: always() && needs.gate.result != 'cancelled' && needs.gate.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: gate-report
          path: report

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.renders.result != 'skipped'
        continue-on-error: true
        with:
          name: renders-report
          path: renders

      - name: Post or update the gate comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RESULT: ${{ needs.gate.result }}
          RENDERS: ${{ needs.renders.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' >body.md
          import json, os, re
          marker = "<!-- kadet-hub-gate -->"
          report = ""
          for path in ("report/report.txt", "renders/report.txt"):
              try:
                  report += open(path, encoding="utf-8", errors="replace").read()
              except OSError:
                  pass
          report = re.sub(r"[^\x09\x0a\x20-\x7e]", "?", report or "no report written")[-60000:]
          fence = "`" * max(3, 1 + max((len(m) for m in re.findall(r"`+", report)), default=0))
          passed = os.environ["RESULT"] == "success" and os.environ["RENDERS"] in ("success", "skipped")
          lines = [marker, f"**gate: {'passed' if passed else 'failed'}** ([run]({os.environ['RUN_URL']}))", ""]
          try:
              e = json.load(open("report/entry.json"))
              m = re.fullmatch(r"https://(github|gitlab)\.com/([A-Za-z0-9._-]+/[A-Za-z0-9._-]+)\.git", e["repo"])
              old, new = e.get("previous_sha") or "", e["sha"]
              if m and re.fullmatch(r"[0-9a-f]{40}", new):
                  base = f"https://{m.group(1)}.com/{m.group(2)}"
                  sep = "/-/compare/" if m.group(1) == "gitlab" else "/compare/"
                  if re.fullmatch(r"[0-9a-f]{40}", old):
                      lines.append(f"Code diff since the approved version: {base}{sep}{old}...{new}")
                  else:
                      lines.append(f"New entry; source tree: {base}/tree/{new}")
                  lines.append("")
          except (OSError, ValueError, KeyError, TypeError):
              pass
          lines += [fence, report.rstrip(), fence]
          print("\n".join(lines))
          PY
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- kadet-hub-gate -->"))) | .id' | head -n 1)
          if [[ -n $id ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null
          fi
