name: gate

# pull_request_target takes this file from main, never from the pull request
# (GI-1). Nothing below checks out or runs pull request content.
on: # zizmor: ignore[dangerous-triggers] the gate reads the entry through the API only (GI-1)
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gate # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - name: Gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export GATE_OUT=$RUNNER_TEMP/report
          mkdir -p "$GATE_OUT"
          set -o pipefail
          gate/run 2>&1 | tee "$GATE_OUT/report.txt"

      - name: Keep the report for the comment job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-report
          path: ${{ runner.temp }}/report
          retention-days: 7
          if-no-files-found: ignore

  # GI-4: posts the report as escaped text; no checkout, no other permission.
  comment:
    needs: gate
    if: always() && needs.gate.result != 'cancelled' && needs.gate.result != 'skipped'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: gate-report
          path: report

      - name: Post or update the gate comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RESULT: ${{ needs.gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' >body.md
          import json, os, re
          marker = "<!-- kadet-hub-gate -->"
          try:
              report = open("report/report.txt", encoding="utf-8", errors="replace").read()
          except OSError:
              report = "no report written"
          report = re.sub(r"[^\x09\x0a\x20-\x7e]", "?", report)[-60000:]
          fence = "`" * max(3, 1 + max((len(m) for m in re.findall(r"`+", report)), default=0))
          lines = [marker, f"**gate: {'passed' if os.environ['RESULT'] == 'success' else 'failed'}** ([run]({os.environ['RUN_URL']}))", ""]
          try:
              e = json.load(open("report/entry.json"))
              m = re.fullmatch(r"https://(github|gitlab)\.com/([A-Za-z0-9._-]+/[A-Za-z0-9._-]+)\.git", e["repo"])
              old, new = e.get("previous_sha") or "", e["sha"]
              if m and re.fullmatch(r"[0-9a-f]{40}", new):
                  base = f"https://{m.group(1)}.com/{m.group(2)}"
                  sep = "/-/compare/" if m.group(1) == "gitlab" else "/compare/"
                  if re.fullmatch(r"[0-9a-f]{40}", old):
                      lines.append(f"Code diff since the approved version: {base}{sep}{old}...{new}")
                  else:
                      lines.append(f"New entry; source tree: {base}/tree/{new}")
                  lines.append("")
          except (OSError, ValueError, KeyError, TypeError):
              pass
          lines += [fence, report.rstrip(), fence]
          print("\n".join(lines))
          PY
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- kadet-hub-gate -->"))) | .id' | head -n 1)
          if [[ -n $id ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null
          fi
