name: fuzz

# GI-14: ClusterFuzzLite runs the atheris targets in tests/fuzz/ on pull
# requests that change a fuzzed parser (code-change mode) and weekly (batch
# mode). NO_CLUSTERFUZZ_DEPLOYMENT turns off its artifact store, which reads
# corpora and builds back from earlier runs (GI-10).
on:
  pull_request:
    paths:
      - .clusterfuzzlite/**
      - .github/workflows/fuzz.yml
      - tests/fuzz/**
      - gate/check_entry.py
      - gate/check_recipe.py
      - release/tree.py
      - gate/schema_diff.py
      - consumer/plan.py
      - sandbox/schema_check.py
      - sandbox/tag_check.py
      - sandbox/tf_schema.py
      - policy/**
  schedule:
    - cron: "41 2 * * 3"
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NO_CLUSTERFUZZ_DEPLOYMENT: "true"
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python

      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 300 || 1800 }}
