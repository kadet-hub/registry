name: release

# PUB-1 to PUB-6, CAT-1. Only this workflow holds publishing permissions:
# its sign, sandbox and index jobs in the release environment, and its pages
# job in the github-pages environment (GI-8).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      names: ${{ steps.build.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build sandbox image
        run: docker build -t kadet-hub/sandbox sandbox

      - name: Fetch, validate and build
        id: build
        run: |
          release/build-all "$RUNNER_TEMP/out"
          echo "names=$(cat "$RUNNER_TEMP/out/names.json")" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: ${{ runner.temp }}/out
          retention-days: 1

  sign:
    needs: build
    if: needs.build.outputs.names != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write # push and tag on ghcr.io
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.build.outputs.names) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-oras # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
        with:
          token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: built

      - name: Verify and push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
        run: release/sign "$NAME" "built/$NAME"

      - name: Attest
        if: steps.push.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Tag
        if: steps.push.outputs.publish == 'true'
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.push.outputs.version }}
        run: oras tag -- "$REF@$DIGEST" "$VERSION"

  sandbox:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write # push and tag on ghcr.io
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-oras # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
        with:
          token: ${{ github.token }}

      - name: Build and push the sandbox image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: release/publish-sandbox

      - name: Attest
        if: steps.push.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Tag
        if: steps.push.outputs.publish == 'true'
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TREE: ${{ steps.push.outputs.tree }}
        run: oras tag -- "$REF@$DIGEST" "$TREE"

  index:
    needs: [build, sign]
    if: always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write # push and tag on ghcr.io
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-oras # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
        with:
          token: ${{ github.token }}

      - name: Build and push the index
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES_API: ${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}/${{ github.repository_owner }}
          INDEX_OUT: ${{ runner.temp }}/index.json
        run: release/publish-index

      - name: Attest
        if: steps.push.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Tag
        if: steps.push.outputs.publish == 'true'
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SERIAL: ${{ steps.push.outputs.serial }}
        run: oras tag -- "$REF@$DIGEST" "$SERIAL" latest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index
          path: ${{ runner.temp }}/index.json
          retention-days: 1

  catalog:
    needs: index
    # always(): index runs after a skipped sign job, which would skip this one too
    if: always() && needs.index.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-hugo # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: index
          path: ${{ runner.temp }}/index

      - name: Build the catalog
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: catalog/build "$RUNNER_TEMP/index/index.json" "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  pages:
    needs: catalog
    if: always() && needs.catalog.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write # deploy the catalog (CAT-1)
      id-token: write # Pages deployment token
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
