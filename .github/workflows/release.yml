name: release

# PUB-1 to PUB-13, CMP-4, REC-11 to REC-13, CAT-1, CAT-7, CAT-14, CAT-20, CAT-27. Only this workflow holds publishing permissions:
# its sign, sandbox, mirror, index and github-release jobs in the release environment,
# and its pages job in the github-pages environment (GI-8).
on:
  push:
    branches: [main]
    paths-ignore: # CI-2: files no release job reads
      - docs/**
      - tests/**
      - "*.md"
      - renovate.json
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - .github/CODEOWNERS
      - .github/ruleset*.json
      - .github/workflows/selftest.yml
      - .github/workflows/consumer-selftest.yml
      - .github/workflows/catalog-tests.yml
      - .github/workflows/release-tests.yml
      - .github/workflows/workflows.yml
      - .github/workflows/scorecard.yml
      - .github/workflows/codeql.yml
      - .github/workflows/fuzz.yml
      - .clusterfuzzlite/**
  schedule:
    - cron: "17 4 * * *" # CAT-20: refresh the 👍 counts and stars daily
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # REC-12: a recipe version runs the gate's checks and renders proof here
    permissions:
      contents: read
      packages: read # which versions are published (CMP-4), the latest index (PUB-9)
      attestations: read # gh attestation verify in a recipe version's checks (REC-12)
    outputs:
      names: ${{ steps.build.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gate # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - uses: ./.github/actions/setup-oras # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
        with:
          token: ${{ github.token }}

      - uses: ./.github/actions/setup-kind # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - name: Fetch, validate and build
        id: build
        env:
          GH_TOKEN: ${{ github.token }} # only gate/recipe-checks gets it (REC-12)
        run: |
          release/build-all "$RUNNER_TEMP/out"
          echo "names=$(cat "$RUNNER_TEMP/out/names.json")" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: ${{ runner.temp }}/out
          retention-days: 1

  sign:
    needs: build
    if: needs.build.outputs.names != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write # push and tag on ghcr.io
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.build.outputs.names) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-oras # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
        with:
          token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: built

      - name: Verify and push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
        run: release/sign "$NAME" "built/$NAME"

      - name: Attest
        if: steps.push.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true # PUB-3a
          create-storage-record: false # needs artifact-metadata: write

      - name: Attest the SBOM
        if: steps.push.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true # PUB-3a
          create-storage-record: false # needs artifact-metadata: write
          sbom-path: ${{ steps.push.outputs.sbom }}

      - name: Attest the output diff
        if: steps.push.outputs.publish == 'true' && steps.push.outputs.diff != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true # PUB-3a
          create-storage-record: false # needs artifact-metadata: write
          predicate-type: https://kadet-hub.org/output-diff/v1
          predicate-path: ${{ steps.push.outputs.diff }}

      - name: Tag
        if: steps.push.outputs.publish == 'true'
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.push.outputs.version }}
        run: oras tag -- "$REF@$DIGEST" "$VERSION"

  sandbox:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write # push and tag on ghcr.io
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-oras # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
        with:
          token: ${{ github.token }}

      - name: Build and push the sandbox image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: release/publish-sandbox

      - name: Attest
        if: steps.push.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true # PUB-3a
          create-storage-record: false # needs artifact-metadata: write

      - name: Tag
        if: steps.push.outputs.publish == 'true'
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TREE: ${{ steps.push.outputs.tree }}
        run: oras tag -- "$REF@$DIGEST" "$TREE"

  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write # push and tag on ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-oras # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
        with:
          token: ${{ github.token }}

      - name: Mirror the KubeVirt CSI driver
        run: >-
          release/mirror-image quay.io/kubevirt/kubevirt-csi-driver:latest kubevirt-csi-driver
          https://github.com/kubevirt/csi-driver
          https://mirror.stream.centos.org/9-stream/BaseOS/source/tree/Packages/
          https://mirror.stream.centos.org/9-stream/AppStream/source/tree/Packages/

  index:
    needs: [build, sign]
    if: always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write # push and tag on ghcr.io
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation
    outputs:
      publish: ${{ steps.push.outputs.publish }}
      serial: ${{ steps.push.outputs.serial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-oras # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
        with:
          token: ${{ github.token }}

      - name: Build and push the index
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES_API: ${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}/${{ github.repository_owner }}
          INDEX_OUT: ${{ runner.temp }}/index.json
          NOTES_OUT: ${{ runner.temp }}/notes.md
        run: release/publish-index

      - name: Attest
        if: steps.push.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true # PUB-3a
          create-storage-record: false # needs artifact-metadata: write

      - name: Attest index.json (PUB-12)
        id: attest-file
        if: steps.push.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/index.json

      - name: Tag
        if: steps.push.outputs.publish == 'true'
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SERIAL: ${{ steps.push.outputs.serial }}
        run: oras tag -- "$REF@$DIGEST" "$SERIAL" latest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index
          path: ${{ runner.temp }}/index.json
          retention-days: 1

      - name: Release assets (PUB-12)
        if: steps.push.outputs.publish == 'true'
        env:
          BUNDLE: ${{ steps.attest-file.outputs.bundle-path }}
        run: |
          dir=$RUNNER_TEMP/github-release
          mkdir -- "$dir"
          cp -- "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/notes.md" "$dir/"
          cp -- "$BUNDLE" "$dir/index.json.sigstore.json"
          jq -ec .dsseEnvelope "$BUNDLE" >"$dir/index.json.intoto.jsonl"

      - if: steps.push.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release
          path: ${{ runner.temp }}/github-release
          retention-days: 1

  github-release:
    needs: index
    # always(): as for catalog below
    if: always() && needs.index.result == 'success' && needs.index.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the release and its tag (PUB-12)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release
          path: github-release

      - name: Create the release
        working-directory: github-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERIAL: ${{ needs.index.outputs.serial }}
        run: >-
          gh release create --target "$GITHUB_SHA" --title "Index serial $SERIAL" --notes-file notes.md
          -- "index-$SERIAL" index.json index.json.sigstore.json index.json.intoto.jsonl

  catalog:
    needs: index
    # always(): index runs after a skipped sign job, which would skip this one too
    if: always() && needs.index.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # the latest artifacts' READMEs (CAT-7)
      attestations: read # the SBOM and output diff attestations (CAT-14, CAT-27)
      discussions: write # one discussion per generator and its 👍 count (CAT-20)
      issues: read # the open generator requests (CAT-31)
      pull-requests: read # the gate comments on entry pull requests (CAT-33)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-hugo # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - uses: ./.github/actions/setup-oras # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
        with:
          token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: index
          path: ${{ runner.temp }}/index

      - name: Build the catalog
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: catalog/build "$RUNNER_TEMP/index/index.json" "$RUNNER_TEMP/site"

      - name: Check the built site (CAT-11d)
        run: python3 -I catalog/seo_check.py "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  pages:
    needs: catalog
    if: always() && needs.catalog.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write # deploy the catalog (CAT-1)
      id-token: write # Pages deployment token
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
