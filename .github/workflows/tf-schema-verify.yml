name: tf-schema-verify

# QA-9: a maintainer checks that a pull request's Terraform schema extracts
# equal the schemas of the provider versions they name. Started by hand; the
# generator tree is fetched as data, only the providers run.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number of the entry or bump
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        env:
          # renovate: datasource=docker depName=hashicorp/terraform
          TERRAFORM_IMAGE: hashicorp/terraform:1.16.6@sha256:bfffc1ded5fbf0a17beaaf22eb4793980abdb19d0761ff6a3a0efb2ab4d9b316
        run: |
          c=$(docker create "$TERRAFORM_IMAGE")
          sudo docker cp -q "$c:/bin/terraform" /usr/local/bin/terraform
          docker rm "$c" >/dev/null

      - name: Compare the extracts with the provider schemas
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: gate/tf-schema-verify
