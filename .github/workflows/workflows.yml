name: workflows

# GI-6, GI-10, GI-11 on pull requests that change workflows, actions or the
# sandbox image's downloads.
on:
  pull_request:
    paths:
      - .github/**
      - sandbox/Dockerfile
      - tests/workflow-policy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pins and caches
        run: tests/workflow-policy

      - name: Install actionlint and zizmor
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          curl -fsSLo "$RUNNER_TEMP/zizmor.tar.gz" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C /usr/local/bin actionlint
          sudo tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C /usr/local/bin zizmor

      - name: actionlint
        # actionlint 1.7.12 does not know the self-repository syntax $/.
        run: actionlint -ignore 'specifying action "\$/'

      - name: zizmor
        run: zizmor --offline --format plain .github
