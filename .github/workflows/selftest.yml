name: selftest

# CI-1: the gate selftest, on pull requests that change its inputs.
on:
  pull_request:
    paths:
      - sandbox/**
      - scan/**
      - gate/**
      - policy/**
      - consumer/unpack.py
      - release/tree.py
      - tests/selftest
      - tests/samples/**
      - .github/actions/setup-gate/**
      - .github/actions/setup-check/**
      - .github/actions/setup-kind/**
      - .github/actions/setup-gvisor/**
      - .github/actions/setup-oras/**
      - .github/workflows/selftest.yml
  workflow_dispatch:

permissions:
  contents: read
  attestations: read # gh attestation verify in the recipe samples (REC-6)

jobs:
  gate-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests on the runner
        run: |
          python3 -m unittest discover -s sandbox -p 'test_check.py' -v
          python3 -m unittest discover -s gate -p 'test_fetch*.py' -v
          python3 -m unittest discover -s gate -p 'test_output*.py' -v

      - uses: ./.github/actions/setup-gate # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - name: Unit tests in the sandbox image
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo -e PYTHONDONTWRITEBYTECODE=1 kadet-hub/sandbox \
            sh -c 'cd scan && python -m unittest discover -v && cd ../gate && python -m unittest discover -p "test_check*.py" -v && python -m unittest discover -p "test_schema*.py" -v && cd ../sandbox && python -m unittest discover -p "test_output*.py" -v && python -m unittest discover -p "test_tag*.py" -v && python -m unittest discover -p "test_schema*.py" -v && python -m unittest discover -p "test_tf_schema*.py" -v && python -m unittest discover -p "test_apiserver*.py" -v'

      - uses: ./.github/actions/setup-oras # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - uses: ./.github/actions/setup-kind # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - name: Gate selftest
        env:
          GH_TOKEN: ${{ github.token }}
        run: tests/selftest
