name: scorecard

# GI-12: OpenSSF Scorecard, published for the badge and uploaded to code
# scanning. The Scorecard API rejects the result if this workflow gains env,
# defaults, workflow-level write permissions or a step outside its allowlist.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF upload to code scanning
      id-token: write # signs the published result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
