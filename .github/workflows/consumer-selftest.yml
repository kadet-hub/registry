name: consumer-selftest

# CI-1: the consumer selftest, on pull requests that change its inputs.
on:
  pull_request:
    paths:
      - consumer/**
      - sandbox/**
      - gate/fetch_tree.py
      - policy/output/**
      - policy/binaries.txt
      - tests/consumer-selftest
      - tests/consumers/**
      - .github/actions/setup-gvisor/**
      - .github/workflows/consumer-selftest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gvisor # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout

      - name: Build sandbox image
        run: docker build -t kadet-hub/sandbox sandbox

      - name: Unit tests in the sandbox image
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo/consumer -e PYTHONDONTWRITEBYTECODE=1 kadet-hub/sandbox \
            python -m unittest discover -v

      - name: Consumer selftest
        run: tests/consumer-selftest
