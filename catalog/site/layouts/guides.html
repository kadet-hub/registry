{{ define "main" }}
<header class="page-head">
  <div class="page-head-text">
    <h1>Guides</h1>
    <p class="lead">{{ .Description }}</p>
  </div>
  {{ partial "spot.html" "guide" }}
</header>
<section class="prose-page">
<ul class="guide-list columns">
{{ range where site.RegularPages "Section" "guides" }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a><p>{{ .Description }}</p></li>{{ end }}
</ul>
</section>
{{ end }}
