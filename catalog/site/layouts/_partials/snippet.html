{{/* A code block with a copy button (CAT-9). dict: id, label, text, event (CAT-42, optional). */}}
<div class="snippet">
  <pre id="{{ .id }}"><code>{{ .text }}</code></pre>
  <button type="button" class="copy icon-button" data-copy="{{ .id }}" aria-label="Copy {{ .label }}"{{ with .event }} data-goatcounter-click="{{ . }}" data-goatcounter-title="Copy {{ $.label }}"{{ end }} hidden><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button>
</div>
