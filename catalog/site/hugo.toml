# Catalog site (CAT-1 to CAT-11). data/catalog.json is written by view.py;
# build passes --baseURL, so canonical URLs and the sitemap are absolute.
baseURL = "https://kadet-hub.org/"
relativeURLs = true
title = "kadet-hub"
enableRobotsTXT = true
disableKinds = ["section", "taxonomy", "term", "rss"]

# CAT-25: origin of the GoatCounter instance, e.g. https://stats.example.org; empty loads no counter.
[params]
goatcounter = "https://stats.kadet-hub.org"

[sitemap]
changeFreq = "daily"

# Highlighting as classes: the CSP blocks inline styles.
[markup.highlight]
noClasses = false

# CAT-18: Atom feed of published versions at /index.xml.
[outputFormats.atom]
mediaType = "application/atom+xml"
baseName = "index"
isPlainText = false

[mediaTypes."application/atom+xml"]
suffixes = ["xml"]

# CAT-16: /llms.txt from the catalog data.
[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true

[outputs]
home = ["html", "atom", "llms"]

# CAT-28: a Markdown variant at index.md of every generator and guide page,
# with Hugo's built-in markdown output format.
[[cascade]]
outputs = ["html", "markdown"]
[cascade.target]
path = "{/generators/*,/guides/*}"
